name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Build and verify production web assets
        run: npm run build
      - name: Sync the production app to Capacitor
        run: |
          if [ ! -f android/gradlew ]; then npx cap add android; fi
          npx cap sync android
          npm run verify:web -- android/app/src/main/assets/public
      - name: Assemble debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug
      - name: Verify the web assets embedded in the APK
        run: |
          mkdir -p "$RUNNER_TEMP/dayquest-apk"
          unzip -q android/app/build/outputs/apk/debug/app-debug.apk 'assets/public/*' -d "$RUNNER_TEMP/dayquest-apk"
          npm run verify:web -- "$RUNNER_TEMP/dayquest-apk/assets/public"
      - uses: actions/upload-artifact@v4
        with:
          name: DayQuest-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
